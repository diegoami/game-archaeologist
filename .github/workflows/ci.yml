name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Relative Markdown links resolve and JSON files parse (this repository is documents for now).
      - run: python3 tools/check_links.py
      # The copied harness tools run here (harness.lock pins them).
      - run: node tools/harness/review.mjs --self-test

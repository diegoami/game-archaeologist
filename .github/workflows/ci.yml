name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Relative Markdown links resolve and JSON files parse (this repository is documents for now).
      - run: python3 tools/check_links.py
      # The record formats: schemas against their valid and invalid examples, and the vocabulary (formats/README.md).
      - run: python3 tests/formats/check_examples.py
      # The validator game repositories fetch and call (formats/README.md).
      - run: python3 tools/validate_records.py formats/examples/valid/*.json
      # Malformed documents are errors, not crashes (R1, PR #20).
      - run: python3 tests/formats/check_validator.py
      # The copied harness tools run here (harness.lock pins them).
      - run: node tools/harness/review.mjs --self-test
